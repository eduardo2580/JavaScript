<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <title>Trivia!</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle multiple choice answers
            document.querySelectorAll('.correct').forEach(button => {
                button.addEventListener('click', function() {
                    this.style.backgroundColor = '#28a745'; // Green
                    this.parentElement.querySelector('.feedback').textContent = 'Correct!';
                });
            });

            document.querySelectorAll('.incorrect').forEach(button => {
                button.addEventListener('click', function() {
                    this.style.backgroundColor = '#dc3545'; // Red
                    this.parentElement.querySelector('.feedback').textContent = 'Incorrect';
                });
            });

            // Handle free response answer
            document.querySelector('#check').addEventListener('click', function() {
                const input = document.querySelector('#answer');
                const feedback = input.parentElement.querySelector('.feedback');
                if (input.value.trim().toLowerCase() === 'paris') {
                    input.style.backgroundColor = '#28a745';
                    feedback.textContent = 'Correct!';
                } else {
                    input.style.backgroundColor = '#dc3545';
                    feedback.textContent = 'Incorrect';
                }
            });
        });
    </script>
</head>
<body>
    <div class="header">
        <h1>Trivia!</h1>
    </div>

    <div class="container">
        <div class="section">
            <h2>Part 1: Multiple Choice</h2>
            <hr>
            <h3>Which planet is known as the Red Planet?</h3>
            <button class="incorrect">Venus</button>
            <button class="correct">Mars</button>
            <button class="incorrect">Jupiter</button>
            <button class="incorrect">Saturn</button>
            <p class="feedback"></p>
        </div>

        <div class="section">
            <h2>Part 2: Free Response</h2>
            <hr>
            <h3>What is the capital of France?</h3>
            <input type="text" id="answer">
            <button id="check">Check Answer</button>
            <p class="feedback"></p>
        </div>
    </div>
</body>
</html>
